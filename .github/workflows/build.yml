name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sabit imzayi kur
        run: |
          mkdir -p ~/.android
          base64 -d keystore.b64 > ~/.android/debug.keystore
          base64 -d keystore.b64 > app/debug.keystore
          ls -l app/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Derle
        run: gradle assembleDebug --no-daemon

      - name: Imzayi dogrula
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | head -25

      - name: APK yukari at
        uses: actions/upload-artifact@v4
        with:
          name: GecGec-APK
          path: app/build/outputs/apk/debug/*.apk
